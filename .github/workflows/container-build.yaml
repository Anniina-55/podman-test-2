name: Build and push container image to GHCR

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Build container image from Containerfile
      - name: Build image
        run: podman build -t myapp:v1 .

      # Login to GitHub Container Registry (GHCR)
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # Tag image for GHCR
      - name: Tag image
        run: podman tag myapp:v1 ghcr.io/${{ github.repository_owner }}/myapp:v1

      # Push image to GHCR
      - name: Push image
        run: podman push ghcr.io/${{ github.repository_owner }}/myapp:v1
