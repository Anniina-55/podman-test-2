name: Build and deploy versioned image to GHCR + Render

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Lowercase owner for GHCR compatibility
      - name: Set lowercase owner
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Use git tag as image version (v1.0.0 etc.)
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      # Login to GHCR
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # Build image (ONLY version tag)
      - name: Build image
        run: |
          podman build \
            -t ghcr.io/${{ env.OWNER_LC }}/myapp:${{ env.IMAGE_TAG }} \
            .

      # Push versioned image
      - name: Push image
        run: |
          podman push ghcr.io/${{ env.OWNER_LC }}/myapp:${{ env.IMAGE_TAG }}

      # Trigger Render deployment
      - name: Trigger Render deploy
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
